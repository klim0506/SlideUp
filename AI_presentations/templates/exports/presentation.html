<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ presentation.title|default:"Presentation" }}</title>
    <style>
      @page { size: 13.33in 7.5in; margin: 0; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        color: #{{ theme.text }};
        background: #{{ theme.bg }};
      }
      .slide {
        position: relative;
        width: 13.33in;
        height: 7.5in;
        padding: 0.7in 0.85in;
        page-break-after: always;
        background: #{{ theme.bg }};
        color: #{{ theme.text }};
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.18in;
      }
      .slide:last-child { page-break-after: auto; }
      .slide.slide-title {
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .slide-title { font-size: 30pt; line-height: 1.06; margin: 0; }
      .slide.slide-title .slide-title { font-size: 44pt; letter-spacing: -0.02em; }
      .slide-subtitle { color: #{{ theme.accent }}; font-size: 18pt; line-height: 1.3; margin: 0; }
      .slide-bullets {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.18in;
        font-size: 18pt;
        line-height: 1.32;
      }
      .slide-bullets li {
        display: grid;
        grid-template-columns: 0.5in 1fr;
        align-items: baseline;
        gap: 0.18in;
      }
      .slide-bullet-marker {
        color: #{{ theme.accent }};
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.72em;
        font-weight: 700;
      }
      .slide-bullet-text { color: #{{ theme.text }}; }
      .slide-stats {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(2.4in, 1fr));
        gap: 0.4in;
      }
      .slide-stats .slide-stat {
        border-top: 3px solid #{{ theme.accent }};
        padding-top: 0.18in;
        display: grid;
        gap: 0.06in;
      }
      .slide-stat-value { font-size: 36pt; font-weight: 700; line-height: 1; }
      .slide-stat-label { font-size: 14pt; opacity: 0.78; }
      .slide-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45in;
      }
      .slide-column ul {
        margin: 0;
        padding-left: 0.32in;
        font-size: 16pt;
        line-height: 1.32;
      }
      .slide-column li { margin-bottom: 0.12in; }
      .slide-quote {
        margin: auto 0;
        font-size: 28pt;
        line-height: 1.18;
        font-style: italic;
        padding-left: 0.4in;
        border-left: 4px solid #{{ theme.accent }};
      }
      .slide-quote cite {
        display: block;
        margin-top: 0.2in;
        font-style: normal;
        font-size: 14pt;
        color: #{{ theme.accent }};
      }
      .slide-image { margin: 0; max-height: 4.5in; }
      .slide-image img { max-width: 100%; max-height: 4.5in; object-fit: contain; display: block; }
      .slide-chart .slide-chart-bars {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: flex-end;
        gap: 0.12in;
        height: 2.4in;
      }
      .slide-chart .slide-chart-bars li {
        flex: 1;
        display: grid;
        gap: 0.05in;
        align-items: end;
        text-align: center;
      }
      .slide-chart .slide-chart-label { font-size: 10pt; opacity: 0.7; }
      .slide-chart .slide-chart-value { font-size: 12pt; font-weight: 600; color: #{{ theme.accent }}; }
      .watermark {
        position: absolute;
        right: 0.35in;
        bottom: 0.24in;
        color: #9CA3AF;
        font-size: 10pt;
      }
      .page-counter {
        position: absolute;
        left: 0.35in;
        bottom: 0.24in;
        color: #9CA3AF;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 10pt;
      }
    </style>
  </head>
  <body>
    {% for slide in slides %}
      <article class="slide-frame">
        {{ slide.html|safe }}
        <div class="page-counter">{{ slide.page_label }}</div>
        {% if watermark %}
          <div class="watermark">slidegen.ru</div>
        {% endif %}
      </article>
    {% endfor %}
  </body>
</html>
