services:
  db:
    image: postgres:16-alpine
    container_name: slidegen-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slidegen}
      POSTGRES_USER: ${POSTGRES_USER:-slidegen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidegen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slidegen} -d ${POSTGRES_DB:-slidegen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: slidegen-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: slidegen-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "True"
      DJANGO_DATABASE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_PUBLIC_URL: http://localhost:5173
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ${USERPROFILE:-${HOME}}/.claude:/root/.claude
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: slidegen-celery
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "True"
      DJANGO_DATABASE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command: celery -A slidegen worker -l info
    volumes:
      - .:/app
      - ${USERPROFILE:-${HOME}}/.claude:/root/.claude
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: slidegen-frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: ""
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      # planLimits.js imports ../../../shared/plan_limits.json → /shared/plan_limits.json in container
      - ./shared:/shared:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
